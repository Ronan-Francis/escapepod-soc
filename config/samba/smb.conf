# Decoy SMB server for escapepod-soc. Nobody legitimate should ever connect,
# so every connection is worth an alert.

[global]
   server role = standalone server
   workgroup = WORKGROUP
   netbios name = FILESERVER
   server string = File Server

   # Listen only: no NetBIOS (137-139), so it never announces itself on the LAN.
   disable netbios = yes
   smb ports = 445
   server min protocol = SMB2_10

   # No accounts exist, so every real login fails. Unknown usernames are
   # mapped to a read-only guest so the share can be browsed (and audited).
   map to guest = Bad User
   guest account = nobody

   # Logging: stdout only (see Dockerfile CMD). auth_json_audit gives one JSON
   # line per login attempt with client address, username and workstation.
   logging = file
   log level = 1 auth_json_audit:3 vfs:2

   # Per-file activity on the share: client IP | user | client machine | share
   vfs objects = full_audit
   full_audit:syslog = false
   full_audit:prefix = %I|%u|%m|%S
   full_audit:success = connect disconnect openat create_file renameat unlinkat mkdirat
   full_audit:failure = connect

   # Nothing else.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[Backups]
   path = /srv/decoy-share
   comment = Department backups
   read only = yes
   guest ok = yes
   browseable = yes
