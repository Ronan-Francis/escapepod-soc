# Grafana reads this at startup and creates the Loki data source automatically.
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy          # Grafana's backend queries Loki; your browser never does
    url: http://loki:3100  # container name on the internal "soc" network
    isDefault: true
    editable: false
